name: Déployer la préproduction OVH

on:
  push:
    branches: ["agent/woocommerce-preprod"]
    paths:
      - "wordpress/**"
      - "images/**"
      - ".github/workflows/deploy-preprod.yml"
  workflow_dispatch:

concurrency:
  group: tpulse-preprod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preproduction
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Préparer le thème
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/tpulse build/mu-plugins
          cp -R wordpress/wp-content/themes/tpulse/. build/tpulse/
          if [ -d wordpress/wp-content/mu-plugins ]; then
            cp -R wordpress/wp-content/mu-plugins/. build/mu-plugins/
          fi

      - name: Configurer la connexion OVH
        shell: bash
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -t ed25519 ssh.cluster131.hosting.ovh.net > "$HOME/.ssh/known_hosts"
          fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:N4DQHF8Pzfs8s5/QgV8tEx5NgKZeghhkDfpnO+ZG7Fo"

      - name: Déployer le thème
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete build/tpulse/ veugfyg@ssh.cluster131.hosting.ovh.net:~/www/wp-content/themes/tpulse/
          rsync -az --delete build/mu-plugins/ veugfyg@ssh.cluster131.hosting.ovh.net:~/www/wp-content/mu-plugins/

      - name: Configurer WordPress et WooCommerce
        shell: bash
        run: |
          set -euo pipefail
          ssh veugfyg@ssh.cluster131.hosting.ovh.net 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/www"
          if [ ! -f "$HOME/wp-cli.phar" ]; then
            curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$HOME/wp-cli.phar"
            chmod 700 "$HOME/wp-cli.phar"
          fi
          WP="php $HOME/wp-cli.phar --path=$HOME/www"
          $WP core is-installed
          $WP option update home 'https://preprod.t-pulse-archery.com'
          $WP option update siteurl 'https://preprod.t-pulse-archery.com'
          $WP option update blogname 'T-Pulse Archery'
          $WP option update blogdescription 'Innovation et progression pour les archers'
          $WP option update blog_public 0
          $WP plugin install woocommerce --activate
          $WP theme activate tpulse
          $WP rewrite structure '/%postname%/' --hard
          $WP cache flush
          REMOTE

      - name: Vérifier la préproduction
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/tpulse.html -w '%{http_code}' https://preprod.t-pulse-archery.com/ || true)"
            if [ "$code" = "200" ] && grep -q 'T-Pulse Archery' /tmp/tpulse.html; then exit 0; fi
            sleep 10
          done
          cat /tmp/tpulse.html || true
          exit 1
